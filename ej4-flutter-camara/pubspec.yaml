name: flutter_camara
description: "Cámara y micrófono multiplataforma (Práctica 3, Ejercicio 4)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Versiones fijadas para Flutter 3.24.0 / Dart 3.5.0 (el SDK del equipo).
# No actualizar sin volver a probar la compilación en Android y en iOS.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  provider: ^6.1.2

  # Recursos del dispositivo
  camera: ^0.11.0
  record: 5.1.2
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  permission_handler: ^11.3.1

  # Almacenamiento local
  sqflite: ^2.3.3
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilidades
  image: ^4.2.0
  share_plus: ^10.0.2
  intl: ^0.19.0

# record_android >= 1.4 usa `flutter.compileSdkVersion` en su build.gradle, que
# Flutter 3.24 no expone para plugins; se fija una versión anterior.
dependency_overrides:
  record_android: 1.3.0
  # record_linux 0.7.x no compila con record_platform_interface 1.3+ (se
  # compila aunque la app no se use en Linux).
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  sqlite3: ^2.4.0

flutter:
  uses-material-design: true
